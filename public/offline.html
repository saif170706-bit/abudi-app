<!DOCTYPE html>
<html lang="da" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#004D40" />
  <title>Ingen forbindelse — Ibn Amer</title>
  <link rel="manifest" href="/manifest.json" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100svh;
      background: #efebe1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      padding: 2rem;
      text-align: center;
      overflow: hidden;
    }

    /* Subtle radial glow background */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse 80% 60% at 50% 0%, rgba(0,77,64,0.08) 0%, transparent 70%),
        radial-gradient(ellipse 60% 40% at 80% 100%, rgba(222,169,62,0.06) 0%, transparent 60%);
      pointer-events: none;
    }

    .card {
      background: rgba(255,255,255,0.7);
      backdrop-filter: blur(20px) saturate(1.4);
      -webkit-backdrop-filter: blur(20px) saturate(1.4);
      border: 1px solid rgba(255,255,255,0.9);
      border-radius: 2.5rem;
      padding: 3rem 2.5rem;
      max-width: 380px;
      width: 100%;
      box-shadow:
        0 4px 6px -1px rgba(0,0,0,0.05),
        0 20px 60px -10px rgba(0,77,64,0.12);
      position: relative;
      z-index: 1;
    }

    .icon-wrap {
      width: 80px;
      height: 80px;
      background: #004D40;
      border-radius: 28px;
      margin: 0 auto 1.75rem;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    .icon-wrap::after {
      content: '';
      position: absolute;
      inset: -6px;
      border-radius: 34px;
      border: 2px solid rgba(0,77,64,0.15);
      animation: pulse-ring 2.5s ease-in-out infinite;
    }

    @keyframes pulse-ring {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.08); opacity: 0.4; }
    }

    .wifi-icon {
      width: 40px;
      height: 40px;
      color: #DEA93E;
    }

    .ornament {
      font-size: 2rem;
      margin-bottom: 1.25rem;
      opacity: 0.7;
      letter-spacing: 0.1em;
    }

    h1 {
      font-size: 1.6rem;
      font-weight: 800;
      color: #004D40;
      letter-spacing: -0.03em;
      line-height: 1.2;
      margin-bottom: 0.75rem;
    }

    p {
      font-size: 0.8rem;
      font-weight: 700;
      color: rgba(0,77,64,0.45);
      text-transform: uppercase;
      letter-spacing: 0.15em;
      line-height: 1.6;
      margin-bottom: 2rem;
    }

    .divider {
      width: 40px;
      height: 2px;
      background: linear-gradient(90deg, transparent, #DEA93E, transparent);
      margin: 0 auto 1.75rem;
      border-radius: 1px;
    }

    button {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      background: #004D40;
      color: white;
      border: none;
      border-radius: 1rem;
      padding: 0.9rem 2rem;
      font-size: 0.75rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.15em;
      cursor: pointer;
      transition: transform 0.15s ease, opacity 0.15s ease;
      width: 100%;
      justify-content: center;
    }

    button:active { transform: scale(0.97); }
    button:hover { opacity: 0.9; }

    .status {
      margin-top: 1.25rem;
      font-size: 0.7rem;
      font-weight: 700;
      color: rgba(0,77,64,0.3);
      text-transform: uppercase;
      letter-spacing: 0.15em;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.4rem;
    }

    .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #ef4444;
      animation: blink 1.5s ease-in-out infinite;
      flex-shrink: 0;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }

    .quran-text {
      font-family: 'Amiri', 'Traditional Arabic', serif;
      font-size: 1.1rem;
      color: rgba(0,77,64,0.4);
      margin-top: 2rem;
      direction: rtl;
      line-height: 2;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon-wrap">
      <!-- Wifi off icon -->
      <svg class="wifi-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="1" y1="1" x2="23" y2="23"/>
        <path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"/>
        <path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"/>
        <path d="M10.71 5.05A16 16 0 0 1 22.56 9"/>
        <path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"/>
        <path d="M8.53 16.11a6 6 0 0 1 6.95 0"/>
        <circle cx="12" cy="20" r="1" fill="currentColor"/>
      </svg>
    </div>

    <div class="ornament">﷽</div>

    <h1>Ingen forbindelse</h1>
    <p>Du er ikke forbundet til internettet.<br/>Tjek din forbindelse og prøv igen.</p>

    <div class="divider"></div>

    <button onclick="window.location.reload()">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="23 4 23 10 17 10"/>
        <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/>
      </svg>
      Prøv igen
    </button>

    <div class="status">
      <div class="dot"></div>
      Offline
    </div>

    <p class="quran-text">وَمَا تَوْفِيقِي إِلَّا بِاللَّهِ</p>
  </div>

  <script>
    // Auto-reload when connection is restored
    window.addEventListener('online', () => {
      window.location.reload();
    });

    // Check every 10 seconds
    setInterval(() => {
      if (navigator.onLine) {
        window.location.reload();
      }
    }, 10000);
  </script>
</body>
</html>
